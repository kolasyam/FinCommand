# ═══════════════════════════════════════════════
#  FinCommand Pro — Docker Compose (Production)
#  Usage: docker-compose -f docker-compose.yml \
#                        -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════

version: '3.9'

services:

  postgres:
    restart: always
    ports: []            # no external exposure in production
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  api:
    restart: always
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
    ports: []            # only exposed via nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ── Redis for rate limiting & caching (production only) ──
  redis:
    image: redis:7-alpine
    container_name: fc_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - fc_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 150M

  # ── Automated DB backups ──
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: fc_backup
    restart: always
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_DB:       ${DB_NAME:-fincommand}
      POSTGRES_USER:     ${DB_USER:-fincommand_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE:          "@daily"
      BACKUP_KEEP_DAYS:  30
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 12
    volumes:
      - ./backups:/backups
    networks:
      - fc_net

volumes:
  redis_data:
    name: fc_redis_data
