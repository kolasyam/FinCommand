# ═══════════════════════════════════════════════
#  FinCommand Pro — Nginx (Production)
#  SSL · HTTP/2 · HSTS · Security headers
# ═══════════════════════════════════════════════

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  '$request_time';
  access_log /var/log/nginx/access.log main buffer=16k;
  error_log  /var/log/nginx/error.log  warn;

  # Performance
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  client_max_body_size 55M;
  client_body_timeout  60s;
  send_timeout         60s;

  # Gzip
  gzip              on;
  gzip_comp_level   5;
  gzip_min_length   256;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml;

  # Rate limiting
  limit_req_zone  $binary_remote_addr zone=api:20m   rate=100r/m;
  limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;
  limit_req_zone  $binary_remote_addr zone=upload:5m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # SSL session cache
  ssl_session_cache   shared:SSL:20m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Modern SSL
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_dhparam /etc/nginx/dhparam.pem;

  # OCSP Stapling
  ssl_stapling        on;
  ssl_stapling_verify on;
  resolver 8.8.8.8 8.8.4.4 valid=300s;

  upstream api_backend {
    server api:4000 max_fails=3 fail_timeout=30s;
    keepalive 64;
  }

  # ── HTTP → HTTPS redirect ──
  server {
    listen 80;
    server_name fincommand.yourdomain.com;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS ──
  server {
    listen 443 ssl http2;
    server_name fincommand.yourdomain.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options          DENY                                             always;
    add_header X-Content-Type-Options   nosniff                                          always;
    add_header X-XSS-Protection        "1; mode=block"                                  always;
    add_header Referrer-Policy          strict-origin-when-cross-origin                 always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()"      always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    limit_conn conn 30;

    # Health — unrestricted
    location = /api/v1/health {
      proxy_pass http://api_backend;
      access_log off;
    }

    # Auth — strict rate limit
    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      limit_req_status 429;
      include /etc/nginx/proxy_params;
      proxy_pass http://api_backend;
    }

    # File upload — separate limit
    location /api/v1/tb/upload {
      limit_req zone=upload burst=2 nodelay;
      client_max_body_size 55M;
      proxy_read_timeout   120s;
      include /etc/nginx/proxy_params;
      proxy_pass http://api_backend;
    }

    # All other API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      limit_req_status 429;
      include /etc/nginx/proxy_params;
      proxy_pass http://api_backend;
    }

    # Frontend static files
    location / {
      root  /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      expires 1h;
      add_header Cache-Control "public, no-transform";
    }
  }
}
