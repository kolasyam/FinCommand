name: FinCommand Pro — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Unit Tests (no DB needed) ──────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx jest tests/unit/ --no-coverage --forceExit
        env:
          JWT_SECRET: ci_test_secret_32_chars_minimum_ok
          JWT_REFRESH_SECRET: ci_refresh_secret_32_chars_min_ok
          BCRYPT_ROUNDS: '4'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ── Integration Tests (with PostgreSQL) ────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fincommand_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: fincommand_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npx jest --forceExit --coverage
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: fincommand
          DB_USER: fincommand_user
          DB_PASSWORD: ci_test_password
          TEST_DB_NAME: fincommand_test
          JWT_SECRET: ci_test_secret_32_chars_minimum_ok
          JWT_REFRESH_SECRET: ci_refresh_secret_32_chars_min_ok
          JWT_EXPIRES_IN: 15m
          BCRYPT_ROUNDS: '4'
          UPLOAD_DIR: /tmp/fc_test_uploads

  # ── Docker Build Check ──────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fincommand-pro:ci .

      - name: Check image size
        run: docker images fincommand-pro:ci

  # ── Security Audit ─────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
