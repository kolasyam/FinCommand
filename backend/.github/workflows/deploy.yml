name: FinCommand Pro — Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false   # set to true when Docker registry is configured
          tags: |
            fincommand-pro:latest
            fincommand-pro:${{ github.sha }}

      # ── Uncomment and configure one of these deploy targets ──

      # Option A: SSH deploy to VPS
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host:     ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key:      ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /opt/fincommand
      #       git pull origin main
      #       docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
      #       docker system prune -f

      # Option B: Render / Railway / Fly.io — add their deploy action here

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
